name: Build AirHide.dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Build
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AirHide.dylib
          path: AirHide.dylib
