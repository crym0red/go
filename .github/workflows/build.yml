name: Build MRzefvGC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 -fobjc-arc \
            -dynamiclib -framework Foundation -framework UIKit -framework GameKit -framework Security \
            -install_name @rpath/MRzefvGC.dylib -o MRzefvGC.dylib GCBypass.m
          codesign -f -s - MRzefvGC.dylib || true
          file MRzefvGC.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: MRzefvGC
          path: MRzefvGC.dylib
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MRzefvGC.dylib --title "MRzefvGC latest" --notes "Game Center / PlayFab guest-login fallback dylib"
